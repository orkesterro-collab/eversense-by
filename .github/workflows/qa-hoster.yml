name: QA Eversense hosted pages and Google price feed
on:
  push:
    paths:
      - .github/workflows/qa-hoster.yml
      - .github/scripts/check_public_price_feed.py
      - .github/scripts/qa_live_site.py
      - .github/scripts/prepare_hoster_site.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Stage all public files
        run: |
          mkdir -p _deploy
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/scripts/' --exclude='/reference/' --exclude='/README.md' --exclude='/_deploy/' ./ _deploy/
      - name: Prepare and audit all internal static links
        run: python3 .github/scripts/prepare_hoster_site.py
      - name: Verify prices anonymously from Google Sheets
        run: python3 .github/scripts/check_public_price_feed.py
      - name: Check all deployed HTML pages and key resources
        run: python3 .github/scripts/qa_live_site.py
      - name: Upload link audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eversense-site-audit
          path: site-audit.json
          retention-days: 7

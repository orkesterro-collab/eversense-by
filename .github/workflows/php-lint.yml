name: PHP syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          set -e
          find wp-content/themes/eversense -name '*.php' -print0 | xargs -0 -n1 php -l

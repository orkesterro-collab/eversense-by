name: Preview original EVERSENSE HTML mirror
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install media optimizer
        run: python3 -m pip install --break-system-packages Pillow
      - name: Copy original site pages and media
        run: python3 scripts/build_mirror.py
      - name: Save the original mirror for review
        uses: actions/upload-artifact@v4
        with:
          name: original-mirror-preview
          retention-days: 7
          path: |
            index.html
            ru/
            en/
            catalog-ru/
            catalog-en/
            where-to-buy-map-ru/
            where-to-buy-list-ru/
            where-to-buy-map-en/
            where-to-buy-list-en/
            politica-ru/
            politica-en/
            assets/original-tilda/
            reference/original-media-manifest.json
            reference/missing-media.md

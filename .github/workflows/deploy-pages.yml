name: Publish EVERSENSE HTML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Stage project mirror and repair legacy navigation
        run: |
          python3 .github/scripts/test_prepare_pages_site.py
          mkdir -p _pages
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/scripts/' --exclude='/reference/' --exclude='/_pages/' --exclude='/_deploy/' --exclude='/buyer-qa/' ./ _pages/
          python3 .github/scripts/prepare_pages_site.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

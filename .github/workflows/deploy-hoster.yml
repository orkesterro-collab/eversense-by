name: Eversence - preview or deploy to hoster.by

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-hoster.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish files (leave OFF to preview changes only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: eversence-hoster-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Eversence
        uses: actions/checkout@v4

      - name: Inspect FTPS certificate without using credentials
        shell: bash
        run: |
          timeout 12 openssl s_client -connect vh108.hoster.by:21 -starttls ftp -servername vh108.hoster.by -showcerts </dev/null > /tmp/eversence-tls.txt 2>&1 || true
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' /tmp/eversence-tls.txt | sed -n '1,/-----END CERTIFICATE-----/p' > /tmp/eversence-server.crt
          if [ ! -s /tmp/eversence-server.crt ]; then
            echo "No FTPS certificate was returned"
            tail -25 /tmp/eversence-tls.txt
            exit 1
          fi
          openssl x509 -in /tmp/eversence-server.crt -noout -subject -issuer -dates -fingerprint -sha256
          actual="$(openssl x509 -in /tmp/eversence-server.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          expected="25:32:7D:62:99:47:12:DD:70:35:3A:3F:2C:3B:7F:35:66:60:73:CC:C9:50:A0:47:85:A3:7D:4E:5E:8E:C9:BB"
          if [ "$actual" != "$expected" ]; then
            echo "::error::FTPS server certificate does not match the pinned fingerprint. Refusing to send credentials."
            exit 1
          fi
          cp /tmp/eversence-server.crt "$RUNNER_TEMP/eversence-ftps.crt"

      - name: Check FTP password is configured
        env:
          FTP_PASSWORD: ${{ secrets.EVERSENCE_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add EVERSENCE_FTP_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Stage public website files only
        shell: bash
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/scripts/' \
            --exclude='/reference/' \
            --exclude='/README.md' \
            --exclude='/_deploy/' \
            ./ _deploy/
          test -f _deploy/index.html

      # This account MUST have its FTP home restricted to www/eversence.by/.
      # The server directory is intentionally ./ (the FTP account home).
      # First run with publish=false (dry-run) and check the remote path.
      - name: Upload to hoster.by over encrypted FTPS
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/eversence-ftps.crt
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: vh108.hoster.by
          username: eversence-deploy
          password: ${{ secrets.EVERSENCE_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./_deploy/
          server-dir: ./
          dry-run: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          dangerous-clean-slate: false
          log-level: standard
